name: Release

# Every push to main is released automatically. The version is package.json's; when that version
# is already tagged (the merged PR did not bump it), the patch number is bumped and committed to
# main first. Then: tests, package, tag main, GitHub release with aerosim-<version>.tar.gz + .sha256
# (aerocat.tech pins it by version and checksum in its vendor.json), and the site's vendor update.
# "Run workflow" does the same for main by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # the bump commit is pushed with github.token, which starts no new run
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # a run queued behind another may find main already released: nothing to do
      - name: Already released?
        run: |
          if git tag --points-at HEAD | grep -q '^v'; then echo "::notice::main is already released"; echo "SKIP=1" >> "$GITHUB_ENV"; fi

      - if: env.SKIP != '1'
        run: npm ci
      - if: env.SKIP != '1'
        run: npm test

      - if: env.SKIP != '1'
        name: Version (bump the patch if this one is already released)
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/v$pkg" > /dev/null; then
            npm version patch --no-git-tag-version > /dev/null
            pkg="$(node -p "require('./package.json').version")"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "chore(release): $pkg"
            git push origin HEAD:main
          fi
          echo "TAG=v$pkg" >> "$GITHUB_ENV"

      - if: env.SKIP != '1'
        run: npm run package -- "${TAG#v}"

      - if: env.SKIP != '1'
        name: Tag main
        run: |
          git tag "$TAG" HEAD
          git push origin "refs/tags/$TAG"

      - if: env.SKIP != '1'
        name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" release/*.tar.gz release/*.tar.gz.sha256 --title "AeroSim $TAG" --generate-notes --verify-tag

      # Needs a SITE_DISPATCH_TOKEN secret allowed to run workflows in kothf/astro_source-new_theme;
      # without it the site's scheduled vendor update picks the release up later.
      - if: env.SKIP != '1'
        name: Ask aerocat.tech to pick up this release
        env:
          SITE_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SITE_TOKEN" ]; then echo "::notice::No SITE_DISPATCH_TOKEN secret: vendor update not dispatched"; exit 0; fi
          GH_TOKEN="$SITE_TOKEN" gh workflow run vendor-update.yml --repo kothf/astro_source-new_theme --ref main
